server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    client_max_body_size 20M;

    # Kompresi respons teks (HTML halaman, JSON DataTables, JS/CSS) — mengecilkan
    # payload tiap perpindahan menu & load tabel.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;

    # ACME challenge - harus sebelum location lain
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Static assets dengan cache header
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    client_body_timeout 600;
    client_header_timeout 600;
    send_timeout 600;

    location ~ \.php$ {
        # Pakai container_name unik (sc_online_app), BUKAN alias service "app" —
        # nginx di sini ikut proxy-net (shared dengan POS-Harumnya) sekaligus
        # network internal sendiri, dan POS-Harumnya juga punya service
        # bernama "app" di proxy-net. Kalau pakai alias "app", Docker DNS bisa
        # ambigu dan salah resolve ke app POS-Harumnya (pernah kejadian:
        # sc.harumnya.cloud kebuka tapi asetnya dari harumnya.cloud / CORS error).
        fastcgi_pass sc_online_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
        fastcgi_connect_timeout 600;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    location ~ /\.ht {
        deny all;
    }

    # Sembunyikan file sensitif
    location ~ /\.(env|git) {
        deny all;
    }
}
