name: Deploy to Production

# Setiap push ke main: build image (tag = git SHA + latest), lalu deploy
# otomatis ke VPS produksi via SSH. VPS yang sama dengan POS-Harumnya —
# stack ini ikut network + nginx-proxy/acme-companion milik POS-Harumnya.

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/itdevelopmenths/production-lab-online-hs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Opsional: aktifkan required reviewers di Settings -> Environments -> production
    # supaya deploy perlu approval manual sebelum jalan.
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image (tag = SHA + latest)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Nonaktifkan provenance/SBOM - bikin image multi-manifest yg kadang
          # ditolak ghcr.io ("unknown blob").
          provenance: false
          sbom: false

      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GIT_SHA: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GIT_SHA,GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -e
            IMAGE="ghcr.io/itdevelopmenths/production-lab-online-hs"
            HOST_UID="$(id -u)"
            HOST_GID="$(id -g)"

            cd /var/www/production-lab-online-hs

            # 1. Pull image baru & deteksi proxy network terlebih dahulu sebelum
            #    menyentuh file/permission host agar tidak memperpanjang jendela transisi.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            docker pull "$IMAGE:$GIT_SHA"
            docker tag "$IMAGE:$GIT_SHA" "$IMAGE:latest"

            export PROXY_NETWORK=$(docker inspect nginx-proxy \
              -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' \
              | awk '{print $1}')
            echo "Proxy network: ${PROXY_NETWORK:-<not found>}"
            if [ -z "$PROXY_NETWORK" ]; then
              echo "ERROR: container nginx-proxy tidak ditemukan / tidak jalan."
              exit 1
            fi

            # 2. Pastikan group deploy memiliki izin tulis ke storage/bootstrap-cache
            #    TANPA mencabut ownership www-data — container aktif tetap bisa
            #    menulis log/session/cache dan tidak memicu tempnam() saat checkout.
            mkdir -p logs/nginx storage bootstrap/cache \
                     storage/app/public storage/framework/cache/data \
                     storage/framework/sessions storage/framework/views storage/logs

            if [ "$(docker inspect -f '{{.State.Running}}' sc_online_app 2>/dev/null)" = "true" ]; then
              docker compose exec -T --user root app sh -c \
                "chown -R www-data:${HOST_GID} /var/www/storage /var/www/bootstrap/cache && find /var/www/storage /var/www/bootstrap/cache -type d -exec chmod 2775 {} + && find /var/www/storage /var/www/bootstrap/cache -type f -exec chmod 664 {} +"
              docker compose exec -T app php artisan down --render="errors::503" --retry=10 --refresh=15 || true
            else
              sudo -n chown -R "${HOST_UID}:${HOST_GID}" /var/www/production-lab-online-hs/storage /var/www/production-lab-online-hs/bootstrap/cache
            fi

            # 3. Checkout commit yang persis dibangun (kode PHP dibaca dari host).
            git fetch origin
            git checkout -f "$GIT_SHA"

            if [ ! -f .env ]; then
              echo "ERROR: .env production tidak ada di /var/www/production-lab-online-hs" && exit 1
            fi

            docker compose up -d --remove-orphans

            echo "Menunggu database..."
            sleep 15

            # key:generate hanya jika APP_KEY belum diisi.
            if ! grep -q "^APP_KEY=base64:" .env; then
              docker compose exec -T --user root app php artisan key:generate --force
              docker compose exec -T --user root app chown www-data:www-data /var/www/.env
            fi

            # Pertahankan owner www-data dan group deploy + setgid (2775) agar
            # baik PHP-FPM maupun git checkout deploy berikutnya sama-sama punya akses.
            docker compose exec -T --user root app sh -c \
              "chown -R www-data:${HOST_GID} /var/www/storage /var/www/bootstrap/cache && chown -R www-data:www-data /var/www/view-cache && find /var/www/storage /var/www/bootstrap/cache /var/www/view-cache -type d -exec chmod 2775 {} + && find /var/www/storage /var/www/bootstrap/cache /var/www/view-cache -type f -exec chmod 664 {} +"

            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan storage:link --force
            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan optimize
            docker compose exec -T app php artisan view:cache

            # Restart paksa app agar OPcache (validate_timestamps=0) tidak
            # menyajikan bytecode basi dari sebelum optimize di-refresh di atas -
            # kode di-mount dari host, jadi container kadang tidak otomatis
            # di-recreate meski app/resources/config berubah.
            docker compose restart app
            docker compose exec -T app php artisan up || true

            # default.conf di-mount dari host: container nginx tidak di-recreate
            # saat file berubah, jadi reload agar konfigurasi terbaru terbaca.
            docker compose exec -T nginx nginx -t && docker compose exec -T nginx nginx -s reload

            echo "Deploy selesai untuk commit $GIT_SHA"
            docker compose ps